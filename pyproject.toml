[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anaconda-opentelemetry"
dynamic = ["version"]
description = "Anaconda opentelemetry package wrapper."
authors = [
    { name = "Anaconda, Inc.", email = "support@anaconda.com" }
]
license = { text = "Apache 2.0" }  # SPDX identifier
dependencies = [
    "opentelemetry-api >=1.45, <1.46",
    "opentelemetry-sdk >=1.45, <1.46",
    "opentelemetry-exporter-otlp-proto-grpc >=1.45, <1.46",
    "opentelemetry-exporter-otlp-proto-http >=1.45, <1.46",
    "grpcio>=1.71.0",
    "requests>=2.32.5",
]

requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = {attr = "anaconda_opentelemetry.__version__.__SDK_VERSION__"}

[tool.setuptools.packages.find]
include = ["anaconda_opentelemetry"]

[tool.setuptools.package-data]
"anaconda_opentelemetry" = ["py.typed"]

[project.optional-dependencies]
dev = ["mypy"]

[tool.mypy]
# optional: ensures mypy treats the package as typed
strict = true

[tool.pytest.ini_options]
markers = [
    "defaults_availability: queries the conda defaults channel over the network; run by the scheduled deps workflow, not on PRs",
]
# Keep the network-dependent availability-drift check out of the default suite.
# Run it with `pytest -m defaults_availability`.
addopts = '-m "not defaults_availability"'
