name: 'Build and Test Conda Package'
description: 'Builds the conda package and runs tests against the installed package'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
  otel-version:
    description: 'OpenTelemetry minor series to pin, e.g. "1.43". Empty means any version in range.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        python-version: ${{ inputs.python-version }}
        miniforge-version: latest
        auto-activate-base: true

    - name: Install conda-build
      shell: bash -el {0}
      run: |
        conda install -n base -y conda-build -q

    - name: Build conda package
      shell: bash -el {0}
      run: |
        conda build conda-recipe --output-folder ./build -q

    - name: Create test environment and install package
      shell: bash -el {0}
      run: |
        set -euo pipefail
        CHANNELS="--override-channels -c ./build -c defaults"

        PINS=()
        if [[ -n "${{ inputs.otel-version }}" ]]; then
          for p in opentelemetry-api opentelemetry-sdk \
                   opentelemetry-exporter-otlp-proto-grpc \
                   opentelemetry-exporter-otlp-proto-http; do
            PINS+=("$p=${{ inputs.otel-version }}")
          done
        fi

        conda create -n package-test python=${{ inputs.python-version }} -y -q $CHANNELS
        conda activate package-test
        conda install $CHANNELS anaconda-opentelemetry "${PINS[@]}" -y -q
        pip install -r requirements.txt pytest flask

    - name: Report resolved OpenTelemetry versions
      shell: bash -el {0}
      run: |
        set -euo pipefail
        conda activate package-test
        conda list | grep -i opentelemetry
        # Fail loudly if the pin did not take.
        WANT='${{ inputs.otel-version }}' python -c '
        import os, sys
        from opentelemetry.sdk.version import __version__ as got
        want = os.environ["WANT"]
        if want and not got.startswith(want + "."):
            sys.exit(f"expected opentelemetry-sdk {want}.x, resolved {got}")
        print("opentelemetry-sdk", got)'

    - name: Run unit tests
      shell: bash -el {0}
      run: |
        conda activate package-test
        OTEL_USE_CONSOLE_EXPORTER=TRUE python -m pytest tests/unit_tests/

    - name: Run integration tests
      shell: bash -el {0}
      run: |
        conda activate package-test
        python -m pytest tests/integration_tests/
