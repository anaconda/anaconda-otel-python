name: 'Build and Test Conda Package'
description: 'Builds the conda package and runs tests against the installed package'
inputs:
  python-version:
    description: 'Python version to use'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        python-version: ${{ inputs.python-version }}
        miniforge-version: latest
        auto-activate-base: true

    - name: Install conda-build
      shell: bash -el {0}
      run: |
        conda install -n base -y conda-build -q

    - name: Build conda package
      shell: bash -el {0}
      run: |
        conda build conda-recipe --output-folder ./build -q

    - name: Create test environment and install package
      shell: bash -el {0}
      run: |
        conda create -n package-test python=${{ inputs.python-version }} -y -q
        conda activate package-test
        conda install -c ./build anaconda-opentelemetry -y -q
        conda install pytest flask -y -q

    - name: Run unit tests
      shell: bash -el {0}
      run: |
        conda activate package-test
        OTEL_USE_CONSOLE_EXPORTER=TRUE python -m pytest tests/unit_tests/

    - name: Run integration tests
      shell: bash -el {0}
      run: |
        conda activate package-test
        python -m pytest tests/integration_tests/
