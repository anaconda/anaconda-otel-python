name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Parse version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check version parity
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag }}"
          SDK_VERSION=$(grep -oP '__SDK_VERSION__ = "\K[^"]+' anaconda_opentelemetry/__version__.py)

          TAG_VERSION_CLEAN="${TAG_VERSION#v}"

          if [ "$TAG_VERSION_CLEAN" != "$SDK_VERSION" ]; then
            echo "::error::Version mismatch: tag version ($TAG_VERSION_CLEAN) does not match __SDK_VERSION__ ($SDK_VERSION)"
            exit 1
          fi

          echo "Version parity check passed: $TAG_VERSION_CLEAN"

      - name: Parse changelog for release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          SECTION=$(awk -v ver="$TAG" '
            BEGIN { found=0 }
            /^## \[v/ {
              if (found) exit
              if (index($0, ver)) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$SECTION" ]; then
            echo "::error::No changelog entry found for version ${TAG}"
            exit 1
          fi

          BREAKING=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### !!! Breaking Changes/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / { print }
          ')

          ADDED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Added/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          CHANGED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Changed/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          FIXED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Fixed/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          NOTES=""

          if [ -n "$BREAKING" ]; then
            NOTES="### Breaking Changes
          ${BREAKING}

          "
          fi

          if [ -n "$ADDED" ]; then
            NOTES="${NOTES}### Added
          ${ADDED}

          "
          fi

          if [ -n "$CHANGED" ]; then
            NOTES="${NOTES}### Changed
          ${CHANGED}

          "
          fi

          if [ -n "$FIXED" ]; then
            NOTES="${NOTES}### Fixed
          ${FIXED}

          "
          fi

          NOTES="${NOTES}[Full changelog](https://github.com/anaconda/anaconda-otel-python/blob/main/CHANGELOG.md)"

          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target main \
            --notes-file /tmp/release_notes.md

  build:
    name: Build distributions
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: pipx run build

      - name: Verify distributions
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anaconda-opentelemetry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
