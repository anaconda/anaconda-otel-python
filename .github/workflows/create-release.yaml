name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Simply mirroring the pull request testing until I change to workflow_call and can share the matrix
  conda-package-tests:
    name: conda py${{ matrix.python-version }} / otel ${{ matrix.otel-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            otel-version: '1.43'
          - python-version: '3.11'
            otel-version: '1.43'
          - python-version: '3.12'
            otel-version: '1.43'
          - python-version: '3.13'
            otel-version: '1.43'
          - python-version: '3.14'
            otel-version: '1.43'
          - python-version: '3.14'
            otel-version: '1.40'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Build and Test Conda Package
        uses: ./.github/actions/conda-package-tests/
        with:
          python-version: ${{ matrix.python-version }}
          otel-version: ${{ matrix.otel-version }}

  pypi-package-tests:
    name: pypi py${{ matrix.python-version }} / otel ${{ matrix.otel-version || 'resolved' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact patches: pip has no `=1.41` series semantics.
          - python-version: '3.13'
            otel-version: '1.41.1'
          - python-version: '3.13'
            otel-version: '1.42.1'
          # Unpinned, at both ends of `requires-python`.
          - python-version: '3.10'
            otel-version: ''
          - python-version: '3.14'
            otel-version: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Build and Test PyPI Package
        uses: ./.github/actions/pypi-package-tests/
        with:
          python-version: ${{ matrix.python-version }}
          otel-version: ${{ matrix.otel-version }}

  # Lint and type-check on one cell only, not across the matrix.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          python-version: '3.14'
          miniforge-version: latest
          auto-activate-base: true

      - name: Install package at highest version
        shell: bash -el {0}
        run: |
          set -euo pipefail
          conda install --override-channels -c defaults -y -q \
            'opentelemetry-api=1.43' 'opentelemetry-sdk=1.43' \
            'opentelemetry-exporter-otlp-proto-grpc=1.43' \
            'opentelemetry-exporter-otlp-proto-http=1.43' \
            pyyaml requests mypy pytest
          python -m pip install . --no-deps

      - name: Type check the OTel compatibility layer
        shell: bash -el {0}
        run: mypy --follow-imports=silent anaconda_opentelemetry/_compat.py

      # Catches drift between the OTel ranges in pyproject.toml and conda-recipe/meta.yaml
      - name: Check PyPI/conda dependency declarations are in sync
        shell: bash -el {0}
        run: python -m pytest tests/integration_tests/dependency_sync_test.py -q

  release:
    name: Create Release
    needs: [conda-package-tests, pypi-package-tests, static-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Parse version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check version parity
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag }}"
          SDK_VERSION=$(grep -oP '__SDK_VERSION__ = "\K[^"]+' anaconda_opentelemetry/__version__.py)

          TAG_VERSION_CLEAN="${TAG_VERSION#v}"

          if [ "$TAG_VERSION_CLEAN" != "$SDK_VERSION" ]; then
            echo "::error::Version mismatch: tag version ($TAG_VERSION_CLEAN) does not match __SDK_VERSION__ ($SDK_VERSION)"
            exit 1
          fi

          echo "Version parity check passed: $TAG_VERSION_CLEAN"

      - name: Parse changelog for release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          SECTION=$(awk -v ver="$TAG" '
            BEGIN { found=0 }
            /^## \[v/ {
              if (found) exit
              if (index($0, ver)) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$SECTION" ]; then
            echo "::error::No changelog entry found for version ${TAG}"
            exit 1
          fi

          BREAKING=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### !!! Breaking Changes/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / { print }
          ')

          ADDED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Added/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          CHANGED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Changed/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          FIXED=$(echo "$SECTION" | awk '
            BEGIN { found=0 }
            /^### Fixed/ { found=1; next }
            /^###/ { if (found) exit }
            found && /^- / && !/N\/A/ { print }
          ')

          NOTES=""

          if [ -n "$BREAKING" ]; then
            NOTES="### Breaking Changes
          ${BREAKING}

          "
          fi

          if [ -n "$ADDED" ]; then
            NOTES="${NOTES}### Added
          ${ADDED}

          "
          fi

          if [ -n "$CHANGED" ]; then
            NOTES="${NOTES}### Changed
          ${CHANGED}

          "
          fi

          if [ -n "$FIXED" ]; then
            NOTES="${NOTES}### Fixed
          ${FIXED}

          "
          fi

          NOTES="${NOTES}[Full changelog](https://github.com/anaconda/anaconda-otel-python/blob/main/CHANGELOG.md)"

          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --target main \
            --notes-file /tmp/release_notes.md

  build:
    name: Build distributions
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Build wheel and sdist
        run: pipx run build

      - name: Verify distributions
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anaconda-opentelemetry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
