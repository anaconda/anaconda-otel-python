name: Run Unit Tests on PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            package:
              - 'anaconda_opentelemetry/**'
              - 'conda-recipe/**'

  conda-package-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.package == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and Test Conda Package
        uses: ./.github/actions/conda-package-tests/
        with:
          python-version: ${{ matrix.python-version }}

  test-status:
    name: Tests Status
    if: always()
    needs: [detect-changes, conda-package-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate test results
        run: |
          echo "::group::Change Detection Results"
          echo "Package changes detected: ${{ needs.detect-changes.outputs.package }}"
          echo "::endgroup::"

          echo "::group::Test Execution Results"
          echo "Conda package tests result: ${{ needs.conda-package-tests.result }}"
          echo "::endgroup::"

          if [[ "${{ needs.detect-changes.outputs.package }}" == "true" ]]; then
            if [[ "${{ needs.conda-package-tests.result }}" != "success" ]]; then
              echo "Conda package tests failed or were cancelled"
              exit 1
            fi
            echo "All tests passed (required due to changes)"
          else
            echo "Tests skipped (no changes detected)"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual workflow run - checking all executed tests"
            if [[ "${{ needs.conda-package-tests.result }}" != "success" && "${{ needs.conda-package-tests.result }}" != "skipped" ]]; then
              echo "Conda package tests failed in manual run"
              exit 1
            fi
          fi

          echo "::notice:: All required tests have passed!"